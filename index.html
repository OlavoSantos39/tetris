<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tetris Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      overflow: hidden;
    }

    header {
      width: 100%;
      text-align: center;
      padding: 10px 0;
      background-color: #1e1e1e;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: #00e5ff;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      width: 100%;
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      width: 280px;
      margin-bottom: 8px;
      font-size: 1rem;
      font-weight: bold;
    }

    canvas {
      border: 3px solid #333;
      border-radius: 6px;
      background-color: #000;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }

    /* Controles Touch */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      background: #2a2a2a;
      color: #fff;
      border: 2px solid #444;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 14px 0;
      flex: 1;
      text-align: center;
      box-shadow: 0 4px 0 #111;
      transition: active 0.1s;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #111;
      background: #00e5ff;
      color: #000;
    }

    .btn-rotate {
      background: #3d2b56;
      border-color: #8a2be2;
    }

    .btn-drop {
      background: #562b2b;
      border-color: #ff4500;
    }

    /* Modal Game Over */
    .overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .overlay h2 {
      font-size: 2rem;
      color: #ff4500;
      margin-bottom: 10px;
    }

    .restart-btn {
      padding: 12px 24px;
      font-size: 1rem;
      background: #00e5ff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>TETRIS MOBILE</h1>
  </header>

  <div class="game-container">
    <div class="info-bar">
      <div>PONTOS: <span id="score">0</span></div>
      <div>NÍVEL: <span id="level">1</span></div>
    </div>
    <canvas id="tetris" width="240" height="400"></canvas>
  </div>

  <div class="controls">
    <div class="row">
      <div class="btn btn-rotate" id="btn-rotate">↻ Girar</div>
      <div class="btn btn-drop" id="btn-drop">⬇ Queda</div>
    </div>
    <div class="row">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-down">▼</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
  </div>

  <div class="overlay" id="game-over">
    <h2>FIM DE JOGO</h2>
    <p>Pontuação Final: <span id="final-score">0</span></p>
    <button class="restart-btn" onclick="restartGame()">Jogar Novamente</button>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    
    // Configura escala do Canvas (10 colunas, 20 linhas)
    context.scale(20, 20);

    const colors = [
      null,
      '#FF0D72', // T - Rosa
      '#0DC2FF', // I - Ciano
      '#0DFF72', // S - Verde
      '#F538FF', // Z - Roxo
      '#FF8E0D', // L - Laranja
      '#FFE138', // J - Amarelo
      '#3877FF'  // O - Azul
    ];

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece(type) {
      if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 2, 0],
          [0, 2, 0],
          [0, 2, 2],
        ];
      } else if (type === 'J') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [3, 3, 0],
        ];
      } else if (type === 'O') {
        return [
          [4, 4],
          [4, 4],
        ];
      } else if (type === 'Z') {
        return [
          [5, 5, 0],
          [0, 5, 5],
          [0, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0],
        ];
      } else if (type === 'T') {
        return [
          [0, 7, 0],
          [7, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        player.score += rowCount * 10;
        rowCount *= 2;
      }
      updateScore();
    }

    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, {x: 0, y: 0});
      drawMatrix(player.matrix, player.pos);
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = colors[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
            
            // Borda interna das peças
            context.lineWidth = 0.05;
            context.strokeStyle = '#000';
            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerHardDrop() {
      while (!collide(arena, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      playerReset();
      arenaSweep();
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function playerReset() {
      const pieces = 'ILJOTSZ';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      if (collide(arena, player)) {
        document.getElementById('final-score').innerText = player.score;
        document.getElementById('game-over').style.display = 'flex';
        gameOver = true;
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let gameOver = false;

    function update(time = 0) {
      if (gameOver) return;

      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    function updateScore() {
      document.getElementById('score').innerText = player.score;
      document.getElementById('level').innerText = Math.floor(player.score / 100) + 1;
      dropInterval = Math.max(100, 1000 - (Math.floor(player.score / 100) * 100));
    }

    function restartGame() {
      arena.forEach(row => row.fill(0));
      player.score = 0;
      gameOver = false;
      document.getElementById('game-over').style.display = 'none';
      updateScore();
      playerReset();
      update();
    }

    const arena = createMatrix(12, 20);

    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
      score: 0,
    };

    // Eventos de Toque dos Botões
    document.getElementById('btn-left').addEventListener('click', () => playerMove(-1));
    document.getElementById('btn-right').addEventListener('click', () => playerMove(1));
    document.getElementById('btn-down').addEventListener('click', () => playerDrop());
    document.getElementById('btn-rotate').addEventListener('click', () => playerRotate(1));
    document.getElementById('btn-drop').addEventListener('click', () => playerHardDrop());

    // Suporte também para teclado (caso abra no PC)
    document.addEventListener('keydown', event => {
      if (gameOver) return;
      if (event.keyCode === 37) playerMove(-1);
      else if (event.keyCode === 39) playerMove(1);
      else if (event.keyCode === 40) playerDrop();
      else if (event.keyCode === 38) playerRotate(1);
      else if (event.keyCode === 32) playerHardDrop();
    });

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
